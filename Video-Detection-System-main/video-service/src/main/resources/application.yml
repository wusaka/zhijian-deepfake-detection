# 鏈嶅姟閰嶇疆
server:
  port: 9002

spring:
  application:
    name: video-service
  servlet:
    multipart:
      max-file-size: 2048MB
      max-request-size: 2048MB
      enabled: true
  # datasource
  datasource:
    url: jdbc:postgresql://localhost:15432/video_detection
    username: admin
    password: admin123
    driver-class-name: org.postgresql.Driver

  # JPA閰嶇疆
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Kafka閰嶇疆
  kafka:
    bootstrap-servers: localhost:19092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: detectionTask:com.zyn.common.dto.event.DetectionTaskEvent

# 鏂囦欢瀛樺偍閰嶇疆
file:
  storage:
    upload-dir: ./uploads
    chunk-dir: ./chunks
    max-file-size: 2147483648  # 2GB
    allowed-types:
      - mp4
      - avi
      - mov
      - mkv
      - webm

# JWT 閰嶇疆
jwt:
  secret: ${JWT_SECRET:mySecretKeyForJWTTokenGenerationAndValidation12345678901234567890}
  expiration: 86400000  # 24灏忔椂锛堟绉掞級

# 鏃ュ織閰嶇疆
logging:
  level:
    root: INFO
    com.zyn.video: DEBUG
