# 鏈嶅姟閰嶇疆
server:
  port: 9003

spring:
  application:
    name: worker-service

  # datasource
  datasource:
    url: jdbc:postgresql://localhost:15432/video_detection
    username: admin
    password: admin123
    driver-class-name: org.postgresql.Driver

  # JPA閰嶇疆
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # kafka
  kafka:
    bootstrap-servers: localhost:19092
    consumer:
      group-id: detection-workers
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.zyn.common.dto.event
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: detectionCompleted:com.zyn.common.dto.event.DetectionCompletedEvent

# AI鏈嶅姟閰嶇疆
ai:
  service:
    url: http://localhost:5000

# 鏃ュ織閰嶇疆
logging:
  level:
    root: INFO
    com.zyn.worker: DEBUG
    org.springframework.kafka: INFO
    org.apache.kafka: WARN

spring.cloud.compatibility-verifier.enabled: false
