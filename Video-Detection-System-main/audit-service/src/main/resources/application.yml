# 鏈嶅姟閰嶇疆
server:
  port: 9006

spring:
  application:
    name: audit-service

  # datasource
  datasource:
    url: jdbc:postgresql://localhost:15432/video_detection
    username: admin
    password: admin123
    driver-class-name: org.postgresql.Driver

  # JPA閰嶇疆
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # 寮傛浠诲姟閰嶇疆
  task:
    execution:
      pool:
        core-size: 5
        max-size: 10
        queue-capacity: 100

  # Kafka Config
  kafka:
    bootstrap-servers: localhost:19092
    consumer:
      group-id: audit-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: "*"

# 瀹¤閰嶇疆
audit:
  retention-days: 90  # 瀹¤鏃ュ織淇濈暀澶╂暟
  async-enabled: true  # 鏄惁寮傛淇濆瓨

# 鏃ュ織閰嶇疆
logging:
  level:
    root: INFO
    com.zyn.audit: DEBUG
    org.springframework.aop: DEBUG

# JWT閰嶇疆
jwt:
  secret: ${JWT_SECRET:mySecretKeyForJWTTokenGenerationAndValidation12345678901234567890}
  expiration: 86400000  # 24灏忔椂

